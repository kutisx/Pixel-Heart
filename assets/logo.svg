      <stop offset="0%" stop-color="#FF6FAE" stop-opacity=".55" />
      <stop offset="60%" stop-color="#B84CFF" stop-opacity=".18" />
      <stop offset="100%" stop-color="#1A0F16" stop-opacity="0" />
